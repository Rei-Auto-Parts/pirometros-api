[project]
name = "pirometros-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-mock>=3.14",
  "pytest-cov>=5",
  "behave>=1.2.6",
  "black>=24",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
]

# O codigo e importado por PYTHONPATH=/app, declarado no compose; o `pip install -e` existe
# para trazer as ferramentas de desenvolvimento. Sem esta linha o setuptools recusa o
# flat-layout assim que `app/` ganha mais de uma camada no topo.
[tool.setuptools]
packages = []

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RET", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG"]
"infra/migrations/**" = ["ANN", "ARG", "INP001"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
# As camadas de `app/` sao pacotes de namespace, sem __init__.py: sem estas duas linhas o
# mypy enxerga o mesmo arquivo por dois nomes de modulo e para na primeira camada.
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
exclude = ["^main\\.py$", "infra/init/ioc_init\\.py$", "infra/migrations/"]

[[tool.mypy.overrides]]
module = ["behave", "behave.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.bdd.steps.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["*_test.py", "*_test_integration.py"]
python_functions = ["test_should_*", "test_deve_*"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["adapters", "core", "infra", "interfaces"]
# `infra/migrations` e codigo gerado pelo Alembic e exercitado pelo teste de integracao.
omit = ["main.py", "infra/init/ioc_init.py", "infra/migrations/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
